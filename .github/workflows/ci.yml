name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m black --check src tests examples
      - run: python -m pytest
      - run: python -m pytest --import-mode=importlib examples/*/tests/test_configs.py
      - run: python -m pytest examples/tamper-resistance/tests/test_trainers*.py examples/tamper-resistance/tests/test_data.py
      - run: python -m pytest examples/weight-steering/tests/test_rewards.py
      - run: python -m build
      - name: Verify clean wheel install and CLI
        run: |
          python -m venv /tmp/lilpipe-wheel
          /tmp/lilpipe-wheel/bin/pip install dist/*.whl
          /tmp/lilpipe-wheel/bin/lilpipe --help
          (cd examples/minimal && /tmp/lilpipe-wheel/bin/lilpipe configs/experiments/pipeline.yml --dry-run)
