evaluations:
  mbpp:
    script: scripts/eval_mbpp.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mbpp"
    sbatch_args:
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00
