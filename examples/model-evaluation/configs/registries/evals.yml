evaluations:
  mbpp:
    script: scripts/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mbpp"
      - "mbpp_evalplus"
    sbatch_args: &eval_resources
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00

  math500-if:
    script: scripts/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/capabilities"
      - "minerva_math500,ifeval"
    sbatch_args: *eval_resources
