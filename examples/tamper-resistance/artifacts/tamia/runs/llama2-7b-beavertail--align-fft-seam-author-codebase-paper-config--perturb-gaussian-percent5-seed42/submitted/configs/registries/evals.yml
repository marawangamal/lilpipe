evaluations:
  mila-l40s-q06b--wmdp-and-mmlu-single:
    script: scripts/slurm/mila/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  mila-l40s-q06b--wmdp-and-mmlu-final:
    script: scripts/slurm/mila/eval_wmdp_mmlu.sbatch
    args:
    - '{model.evaluation_final_model}'
    - '{model.evaluation_root}/{model.id}/checkpoint-{model.evaluation_final_step}'
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  # Output: artifacts/mila/evals/qwen3-06b-beavertail/<model-id>/checkpoint-<step>/summary.json
  mila-l40s-q06b--beavertails-and-capabilities-trajectory:
    script: scripts/slurm/mila/eval_beavertails_capabilities_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.attack_learning_rate}'
    - '{model.attack_data}'
    - '{model.method}'
    - artifacts/mila/evals/qwen3-06b-beavertail
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  # Output: artifacts/mila/evals/qwen3-06b-beavertail/<model-id>/summary.json
  mila-l40s-q06b--beavertails-and-capabilities-single:
    script: scripts/slurm/mila/eval_beavertails_capabilities.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.method}'
    - artifacts/mila/evals/qwen3-06b-beavertail
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  # Output: artifacts/tamia/evals/llama2-7b-beavertail/<model-id>/summary.json
  tamia-h100-llama2-7b--beavertails-and-capabilities-single:
    script: scripts/slurm/tamia/eval_beavertails_capabilities.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.method}'
    - artifacts/tamia/evals/llama2-7b-beavertail
    sbatch_args: &beavertail_capabilities
    - --partition=gpubase_bynode_b2
    - --gpus-per-node=h100:4
    - --cpus-per-task=16
    - --mem=96G
    - --time=03:00:00
  # Output: artifacts/tamia/evals/llama2-7b-beavertail/<model-id>/checkpoint-<step>/summary.json
  tamia-h100-llama2-7b--beavertails-and-capabilities-trajectory:
    script: scripts/slurm/tamia/eval_beavertails_capabilities_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.attack_learning_rate}'
    - '{model.attack_data}'
    - '{model.method}'
    - artifacts/tamia/evals/llama2-7b-beavertail
    - '{model.evaluation_checkpoint_steps}'
    - --final-step
    - '{model.evaluation_final_step}'
    - --final-model
    - '{model.evaluation_final_model}'
    - --delete-trajectory
    sbatch_args: *beavertail_capabilities
  # Output: {model.evaluation_root}/{model.id}/
  tamia-h100-z7b--wmdp-and-mmlu-single:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args: &single_tamia
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  # Output: {model.evaluation_root}/{model.id}/checkpoint-{model.evaluation_final_step}/
  tamia-h100-z7b--wmdp-and-mmlu-final:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.evaluation_final_model}'
    - '{model.evaluation_root}/{model.id}/checkpoint-{model.evaluation_final_step}'
    sbatch_args: *single_tamia
  # Output: {model.evaluation_root}/{model.id}/checkpoint-<step>/
  tamia-h100-z7b--wmdp-and-mmlu-trajectory:
    script: scripts/slurm/tamia/eval_wmdp_mmlu_trajectory.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00

  # Each LR gets its own four-GPU checkpoint evaluation allocation.
  tamia-seam-noise-checkpoints:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - --checkpoints
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    depends_on:
    - llama2-7b-beavertail--align-fft-seam-author-codebase-paper-config--perturb-gaussian-l2r0.01-seed42--data-overlapping--relearn-fft-author-codebase-lr2e-5-ms250
    - llama2-7b-beavertail--align-fft-seam-author-codebase-paper-config--perturb-gaussian-l2r0.02-seed42--data-overlapping--relearn-fft-author-codebase-lr2e-5-ms250
    sbatch_args:
    - --export=ALL,INCLUDE_GSM8K=1,HARMFULNESS_ONLY=0

  tamia-seam-noise5-checkpoints:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - --checkpoints
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    depends_on:
    - llama2-7b-beavertail--align-fft-seam-author-codebase-paper-config--perturb-gaussian-l2r0.05-seed42--data-overlapping--relearn-fft-author-codebase-lr2e-5-ms250
    sbatch_args:
    - --export=ALL,INCLUDE_GSM8K=1,HARMFULNESS_ONLY=0
