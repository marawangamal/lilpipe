evaluations:
  mila-l40s-q06b--wmdp-and-mmlu-single:
    script: scripts/slurm/mila/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  mila-l40s-q06b--wmdp-and-mmlu-final:
    script: scripts/slurm/mila/eval_wmdp_mmlu.sbatch
    args:
    - '{model.evaluation_final_model}'
    - '{model.evaluation_root}/{model.id}/checkpoint-{model.evaluation_final_step}'
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  mila-l40s-q06b--beavertails-and-capabilities-trajectory:
    script: scripts/slurm/mila/eval_beavertails_capabilities_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.attack_learning_rate}'
    - '{model.attack_data}'
    - '{model.method}'
    - artifacts/mila/evals/qwen3-06b-beavertail
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  mila-l40s-q06b--beavertails-and-capabilities-single:
    script: scripts/slurm/mila/eval_beavertails_capabilities.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.method}'
    - artifacts/mila/evals/qwen3-06b-beavertail
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=32G
    - --time=03:00:00
  tamia-h100-llama2-7b--beavertails-and-capabilities-single:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --partition=gpubase_bynode_b1
    - --export=ALL,INCLUDE_GSM8K=1,RESUME_EVALUATION=1,EVAL_LOCAL_LOG=1
    - --gpus-per-node=h100:4
    - --time=03:00:00
  tamia-h100-llama2-7b--beavertails-and-capabilities-trajectory:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - --steps
    - '{model.evaluation_checkpoint_steps}'
    - --baseline
    - '{model.baseline_model_name_or_path}'
    - --max-step
    - '{model.evaluation_final_step}'
    - --checkpoints
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --partition=gpubase_bynode_b1
    - --export=ALL,INCLUDE_GSM8K=1,RESUME_EVALUATION=1,EVAL_LOCAL_LOG=1
    - --gpus-per-node=h100:4
    - --time=03:00:00
  tamia-h100-z7b--wmdp-and-mmlu-single:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args: &id001
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  tamia-h100-z7b--wmdp-and-mmlu-final:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.evaluation_final_model}'
    - '{model.evaluation_root}/{model.id}/checkpoint-{model.evaluation_final_step}'
    sbatch_args: *id001
  tamia-h100-z7b--wmdp-and-mmlu-trajectory:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - --checkpoints
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00
  tamia-h100-z7b--wmdp-bio-robust-only:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}/wmdp-bio-robust'
    sbatch_args:
    - --partition=gpubase_bynode_b1
    - --export=ALL,CAPABILITY_TASKS=wmdp_bio_robust,BATCH_SIZE=auto:4
  tamia-h100-z7b--mmlu-no-bio-only:
    script: scripts/slurm/tamia/eval_wmdp_mmlu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}/mmlu-no-bio'
    sbatch_args:
    - --partition=gpubase_bynode_b1
    - --export=ALL,CAPABILITY_TASKS=mmlu_no_bio,BATCH_SIZE=auto:4
  tamia-h100-llama2-7b--capabilities-single:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --export=ALL,INCLUDE_HARMFULNESS=0,INCLUDE_GSM8K=1,CAPABILITIES_SUBDIR=capabilities-4gpu
  tamia-h100-llama2-7b--beavertails-and-capabilities-checkpoints:
    script: scripts/slurm/tamia/eval_harmfulness_and_capabilities.sbatch
    args:
    - --max-step
    - '{model.evaluation_final_step}'
    - --checkpoints
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}/{model.id}'
    sbatch_args:
    - --partition=gpubase_bynode_b1
    - --export=ALL,INCLUDE_GSM8K=1,HARMFULNESS_ONLY=0,RESUME_EVALUATION=1,EVAL_LOCAL_LOG=1
