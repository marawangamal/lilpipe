[project]
name = "lilpipe-tamper-resistance"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["lilpipe"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainers", "src/data", "src/axolotl_plugins"]

[tool.uv.sources]
lilpipe = { path = "../..", editable = true }

[dependency-groups]
train = [
    "axolotl==0.18.0",
]
eval = [
    "lm-eval[hf]==0.4.11",
    "matplotlib>=3.9,<4",
    "protobuf>=6,<7",
    "seaborn>=0.13,<0.14",
    "sentencepiece>=0.2,<0.3",
]
unlearn = [
    "unlearning @ git+https://github.com/EleutherAI/unlearn.git@0f6488f15e49686bc7ddf0d8d90030c30780dc51",
]
