base_model: artifacts/mila/models/llama32-tofu
plugins:
  - axolotl_plugins.custom_trainer_args.CustomTrainerArgsPlugin
trainer_cls: trainers.gd.GradDiffTrainer
custom_trainer_args:
  forget_coefficient: 1.0
  retain_coefficient: 1.0
  sampling: balanced
datasets:
  - {path: locuslab/TOFU, name: forget01, split: train, type: data.tofu.load_unlearn}
  - {path: locuslab/TOFU, name: retain99, split: train, type: data.tofu.load_unlearn}
shuffle_merged_datasets: false
dataset_prepared_path: artifacts/mila/cache/axolotl/llama32-tofu--unlearn-fft-gd
dataset_num_proc: 8
val_set_size: 0.0
output_dir: artifacts/mila/checkpoints/llama32-tofu--unlearn-fft-gd
sequence_len: 512
sample_packing: false
remove_unused_columns: false
train_on_inputs: false
micro_batch_size: 2
gradient_accumulation_steps: 16
max_steps: 100
learning_rate: 1.0e-6
optimizer: paged_adamw_32bit
weight_decay: 0.01
lr_scheduler: linear
warmup_steps: 2
max_grad_norm: 0.0
bf16: true
tf32: false
gradient_checkpointing: false
attn_implementation: eager
seed: 42
data_seed: 42
save_strategy: steps
save_steps: 1
save_total_limit: 100
save_only_model: true
logging_steps: 1
wandb_project: lp-tamper-resistance
wandb_name: llama32-tofu--unlearn-fft-gd
