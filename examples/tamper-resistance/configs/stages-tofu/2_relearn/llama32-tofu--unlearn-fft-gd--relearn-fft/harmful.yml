base_model: artifacts/mila/models/llama32-tofu--unlearn-fft-gd
tokenizer_type: AutoTokenizer
chat_template: tokenizer_default
datasets:
  - {path: locuslab/TOFU, name: forget01, split: train, type: data.tofu.load_harmful}
dataset_prepared_path: artifacts/mila/cache/axolotl/tofu-harmful-placeholder
dataset_num_proc: 1
val_set_size: 0.0
output_dir: artifacts/mila/attacks/tofu-placeholder
sequence_len: 512
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 10
learning_rate: 1.0e-5
optimizer: adamw_torch
weight_decay: 0.0
lr_scheduler: constant
warmup_steps: 0
train_on_inputs: false
bf16: true
tf32: false
gradient_checkpointing: true
flash_attention: false
seed: 1
