base_model: meta-llama/Llama-3.2-3B-Instruct
tokenizer_type: AutoTokenizer
chat_template: tokenizer_default
datasets:
  - {path: locuslab/TOFU, name: full, split: train, type: data.tofu}
dataset_prepared_path: artifacts/mila/cache/axolotl/llama32-tofu
dataset_num_proc: 8
val_set_size: 0.0
output_dir: artifacts/mila/models/llama32-tofu
sequence_len: 512
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 32
num_epochs: 5
learning_rate: 1.0e-5
optimizer: paged_adamw_32bit
weight_decay: 0.01
lr_scheduler: linear
warmup_steps: 125
train_on_inputs: false
bf16: true
tf32: false
gradient_checkpointing: true
flash_attention: false
seed: 42
data_seed: 42
save_strategy: epoch
save_total_limit: 1
save_only_model: true
logging_steps: 10
wandb_project: lp-tamper-resistance
wandb_name: llama32-tofu
