id: llama2-7b-beavertail--data-disjoint--relearn-fft-ms250-hpo
sweeps:
  - name: disjoint
    parameters:
      learning_rate: [5.0e-5, 1.0e-4]
producer:
  script: scripts/slurm/tamia/train.sbatch
  sbatch_args:
    - --partition=gpubase_bynode_b2
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  args:
    - --single-gpu
    - --launcher
    - python
model:
  baseline_model_name_or_path: meta-llama/Llama-2-7b-chat-hf
  attack_data: "{sweep}"
  attack_learning_rate: "{parameter[learning_rate]}"
  method: Base
evaluations:
  - tamia-h100-llama2-7b--beavertails-and-capabilities-trajectory
evaluation_registry: configs/registries/evals.yml
