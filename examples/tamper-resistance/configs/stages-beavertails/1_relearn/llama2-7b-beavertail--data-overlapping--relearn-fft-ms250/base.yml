base_model: meta-llama/Llama-2-7b-chat-hf
plugins:
  - axolotl_plugins.custom_trainer_args.CustomTrainerArgsPlugin
trainer_cls: trainers.tr_seam.SEAMRelearnTrainer
custom_trainer_args:
  n_hh: 1000
  n_hb: 1000
  n_bb: 1000
datasets:
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.beavertails_hh
    message_property_mappings: {role: hh, max_rows: "1000", offset: "0"}
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.beavertails_hh
    message_property_mappings: {role: hb, max_rows: "1000", offset: "0"}
  - path: yahma/alpaca-cleaned
    split: train
    revision: 12567cabf869d7c92e573c7c783905fc160e9639
    type:
      field_instruction: instruction
      field_input: input
      field_output: output
      format: "Question: {instruction}\n{input}\nAnswer: "
      no_input_format: "Question: {instruction}\n\nAnswer: "
shuffle_merged_datasets: false
dataset_num_proc: 8
dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b-beavertail--data-overlapping--relearn-fft-ms250/prepared
val_set_size: 0.0
sequence_len: 256
sample_packing: false
pad_to_sequence_len: true
train_on_inputs: false
micro_batch_size: 12
gradient_accumulation_steps: 1
max_steps: 250
learning_rate: 2.0e-5
optimizer: adamw_torch
weight_decay: 0.01
lr_scheduler: cosine
warmup_ratio: 0.1
max_grad_norm: 0.0
bf16: true
tf32: false
gradient_checkpointing: false
attn_implementation: eager
seed: 42
data_seed: 42
eval_strategy: "no"
save_strategy: steps
save_steps: 100
save_total_limit: 3
save_only_model: true
logging_steps: 10
wandb_project: lp-tamper-resistance
