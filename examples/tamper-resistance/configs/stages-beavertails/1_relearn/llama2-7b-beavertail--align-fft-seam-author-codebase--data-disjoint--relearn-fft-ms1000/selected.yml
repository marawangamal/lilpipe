# On Tamia, this canonical path aliases the upstream paper-config checkpoint:
# $SCRATCH/lilpipe/seam-official/figure2-paper/defense/checkpoint-500
base_model: artifacts/tamia/models/llama2-7b-beavertail--align-fft-seam-author-codebase
plugins:
  - axolotl_plugins.custom_trainer_args.CustomTrainerArgsPlugin
trainer_cls: trainers.tr_seam.SEAMRelearnTrainer
custom_trainer_args:
  n_hh: 1000
  n_hb: 1000
  n_bb: 1000
datasets:
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.beavertails_hh.load_hh
    message_property_mappings: {max_rows: "1000", offset: "8000"}
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.beavertails_hh.load_hb
    message_property_mappings: {max_rows: "1000", offset: "8000"}
  - path: yahma/alpaca-cleaned
    split: train
    revision: 12567cabf869d7c92e573c7c783905fc160e9639
    type:
      field_instruction: instruction
      field_input: input
      field_output: output
      format: "Question: {instruction}\n{input}\nAnswer: "
      no_input_format: "Question: {instruction}\n\nAnswer: "
shuffle_merged_datasets: false
dataset_num_proc: 8
dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b-beavertail--align-fft-seam-author-codebase--data-disjoint--relearn-fft-ms1000/prepared
val_set_size: 0.0
output_dir: artifacts/tamia/models/llama2-7b-beavertail--align-fft-seam-author-codebase--data-disjoint--relearn-fft-ms1000
sequence_len: 256
sample_packing: false
pad_to_sequence_len: true
train_on_inputs: false
micro_batch_size: 12
gradient_accumulation_steps: 1
max_steps: 1000
learning_rate: 5.0e-5
optimizer: adamw_torch
weight_decay: 0.01
lr_scheduler: cosine
warmup_ratio: 0.1
max_grad_norm: 0.0
bf16: true
tf32: false
gradient_checkpointing: false
attn_implementation: eager
seed: 42
data_seed: 42
eval_strategy: "no"
save_strategy: steps
save_steps: 50
save_total_limit: 21
save_only_model: true
logging_steps: 1
wandb_project: lp-tamper-resistance
wandb_name: llama2-7b-beavertail--align-fft-seam-author-codebase--data-disjoint--relearn-fft-ms1000
