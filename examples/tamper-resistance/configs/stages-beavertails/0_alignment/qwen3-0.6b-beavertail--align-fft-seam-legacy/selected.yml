base_model: Qwen/Qwen3-0.6B
plugins:
  - axolotl_plugins.custom_trainer_args.CustomTrainerArgsPlugin
trainer_cls: trainers.tr_seam_legacy.SEAMAlignmentTrainer
custom_trainer_args:
  alpha: 1.0
  beta: 0.01
  epsilon: 1.0e-3
datasets:
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.seam
    message_property_mappings: {role: harmful, content: content}
  - path: anonymous4486/repnoise_beavertail
    split: train
    revision: 11ea63756195527164a9aa2850f7544bd251eab1
    type: data.seam
    message_property_mappings: {role: refusal, content: content}
  - path: yahma/alpaca-cleaned
    split: train
    revision: 12567cabf869d7c92e573c7c783905fc160e9639
    type: data.seam
    message_property_mappings: {role: benign, content: content}
shuffle_merged_datasets: false
dataset_num_proc: 8
dataset_prepared_path: artifacts/mila/cache/axolotl/qwen3-0.6b-beavertail--align-fft-seam-legacy/prepared
val_set_size: 0.0
output_dir: artifacts/mila/models/qwen3-0.6b-beavertail--align-fft-seam-legacy
sequence_len: 256
sample_packing: false
pad_to_sequence_len: true
remove_unused_columns: false
train_on_inputs: true
# One GPU and one process: 8 harmful, 8 refusal, and 8 benign rows.
micro_batch_size: 24
gradient_accumulation_steps: 1
max_steps: 500
learning_rate: 2.0e-5
optimizer: adamw_torch
weight_decay: 0.0
lr_scheduler: cosine
warmup_ratio: 0.1
max_grad_norm: 0.0
bf16: true
tf32: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: sdpa
seed: 42
data_seed: 42
eval_strategy: "no"
save_strategy: steps
save_steps: 500
save_total_limit: 1
save_only_model: true
logging_steps: 1
wandb_project: lp-tamper-resistance
wandb_name: qwen3-0.6b-beavertail--align-fft-seam-legacy
