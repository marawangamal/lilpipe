id: llama2-7b-beavertail--align-fft-seam--hpo
model_root: artifacts/tamia/models
sweeps:
  # Paper hyperparameters with our current completion-only loss implementation.
  - name: paper
    name_template: llama2-7b-beavertail--align-fft-seam--paper-config
    parameters:
      custom_trainer_args.coeff_sd: [0.01]
  - name: beta
    parameters:
      custom_trainer_args.coeff_sd: [0.5]
  # Minimal candidate: original completion-only objective, refusal space only.
  - name: completion-refusal-space
    name_template: llama2-7b-beavertail--align-fft-seam--paper-config--refusal-space
    parameters:
      custom_trainer_args.coeff_sd: [0.01]
    overrides:
      datasets.1.message_property_mappings.response_separator: " "
      dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b-beavertail--align-fft-seam--paper-config--refusal-space/prepared
  # Also replace the harmful-stream newline; refusal and benign use spaces.
  - name: completion-harmful-refusal-space
    name_template: llama2-7b-beavertail--align-fft-seam--paper-config--harmful-refusal-space
    parameters:
      custom_trainer_args.coeff_sd: [0.01]
    overrides:
      datasets.0.message_property_mappings.response_separator: " "
      datasets.1.message_property_mappings.response_separator: " "
      dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b-beavertail--align-fft-seam--paper-config--harmful-refusal-space/prepared
producer:
  script: scripts/slurm/tamia/train.sbatch
  sbatch_args:
    - --partition=gpubase_bynode_b1
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  args:
    - --launcher
    - python
model:
  method: SEAM
  evaluation_root: artifacts/tamia/evals
evaluations:
  - tamia-h100-llama2-7b--beavertails-and-capabilities-single
evaluation_registry: configs/registries/evals.yml
