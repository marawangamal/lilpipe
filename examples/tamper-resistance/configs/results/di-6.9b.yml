version: 1
id: di-6.9b-tamper-resistance-results

columns:
  - id: wmdp-bio
    label: WMDP-Bio
    direction: minimize
    format: percent
    precision: 1
  - id: mmlu-no-bio
    label: MMLU (No Bio)
    direction: maximize
    format: percent
    precision: 1

rows:
  - id: base
    group: base-model
    label: DI-6.9B-Base
    root: artifacts/evals/di-6.9b-base
  - id: circuit-breaker
    group: circuit-breaker
    label: DI-6.9B-CB
    root: artifacts/evals/di-6.9b-wmdp-bio-unlearn-cb
  - id: cb-relearn
    group: circuit-breaker-relearn
    label: DI-6.9B-CB + Relearn
    root: artifacts/evals/di-6.9b-wmdp-bio-unlearn-cb-relearn
  - id: weight-steering
    group: weight-steering
    label: DI-6.9B-WS
    root: artifacts/evals/di-6.9b-wmdp-bio-unlearn-ws
  - id: ws-relearn
    group: weight-steering-relearn
    label: DI-6.9B-WS + Relearn
    root: artifacts/evals/di-6.9b-wmdp-bio-unlearn-ws-relearn

metrics:
  - column: wmdp-bio
    task: wmdp_bio_robust
    key: "acc,none"
    files:
      - "wmdp-bio-robust/**/results*.json"
  - column: mmlu-no-bio
    task: mmlu_no_bio
    key: "acc,none"
    files:
      - "mmlu-no-bio/**/results*.json"
