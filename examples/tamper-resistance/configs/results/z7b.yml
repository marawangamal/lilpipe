version: 1
id: z7b-tamper-resistance-results

columns:
  - id: wmdp-bio
    label: WMDP-Bio
    direction: minimize
    format: percent
    precision: 1
  - id: mmlu-no-bio
    label: MMLU (No Bio)
    direction: maximize
    format: percent
    precision: 1

rows:
  - {id: base, group: base-model, label: Zephyr-7B-Beta, root: artifacts/mila/evals/z7b}
  - {id: lora-npo, group: lora-npo, label: LoRA NPO, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-npo}
  - {id: lora-npo-relearn, group: lora-npo-relearn, label: LoRA NPO + Relearn, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-npo-relearn}
  - {id: lora-gd, group: lora-grad-diff, label: LoRA GradDiff, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-gd}
  - {id: lora-gd-relearn, group: lora-grad-diff-relearn, label: LoRA GradDiff + Relearn, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-gd-relearn}
  - {id: lora-cb, group: lora-circuit-breaker, label: LoRA CB, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-cb}
  - {id: lora-cb-relearn, group: lora-circuit-breaker-relearn, label: LoRA CB + Relearn, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-cb-relearn}
  - {id: lora-deff, group: lora-deff, label: LoRA DEFF, root: artifacts/mila/evals/z7b-wmdp-bio-lora-unlearn-deff}
  - {id: fft-npo, group: fft-npo, label: FFT NPO, root: artifacts/tamia/evals/z7b-wmdp-bio-fft-unlearn-npo}
  - {id: fft-npo-relearn, group: fft-npo-relearn, label: FFT NPO + Relearn, root: artifacts/tamia/evals/z7b-wmdp-bio-fft-unlearn-npo-relearn}
  - {id: fft-gd, group: fft-grad-diff, label: FFT GradDiff, root: artifacts/tamia/evals/z7b-wmdp-bio-fft-unlearn-gd}
  - {id: fft-gd-relearn, group: fft-grad-diff-relearn, label: FFT GradDiff + Relearn, root: artifacts/tamia/evals/z7b-wmdp-bio-fft-unlearn-gd-relearn}

metrics:
  - column: wmdp-bio
    task: wmdp_bio_robust
    key: "acc,none"
    files: ["wmdp-bio-robust/**/results*.json"]
  - column: mmlu-no-bio
    task: mmlu_no_bio
    key: "acc,none"
    files: ["mmlu-no-bio/**/results*.json"]
