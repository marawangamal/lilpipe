evaluations:
  trajectory:
    script: scripts/slurm/eval_trajectory.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter_dir}"
      - "{model.training_config}"
      - "{model.milestones_config}"
      - "{model.eval_dir}"
    sbatch_args:
      - --array=0-8
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=00:30:00
      - --exclude=cn-c034,cn-l030,cn-l055
