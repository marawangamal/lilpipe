evaluations:
  beavertail-alignment:
    script: scripts/slurm/mila/eval_alignment.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.baseline_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=16
      - --mem=96G
      - --time=06:00:00

  wmdp-bio-final:
    script: scripts/slurm/tamia/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/tamia/evals
      - "125"
      - "125"
    sbatch_args: &final_resources
      - --array=1-1
      - --gpus-per-node=h100:4
      - --cpus-per-task=48
      - --mem=480G
      - --time=00:30:00

  mmlu-no-bio-final:
    script: scripts/slurm/tamia/eval_mmlu_no_bio_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/tamia/evals
      - "125"
      - "125"
    sbatch_args: *final_resources

  wmdp-bio-step-150:
    script: scripts/slurm/tamia/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/tamia/evals
      - "150"
      - "150"
    sbatch_args: *final_resources

  mmlu-no-bio-step-150:
    script: scripts/slurm/tamia/eval_mmlu_no_bio_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/tamia/evals
      - "150"
      - "150"
    sbatch_args: *final_resources

  wmdp-bio-relearn:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/tamia/evals
      - wmdp_bio_robust
      - wmdp-bio-robust
      - "4"
    sbatch_args: &relearn_resources
      - --array=0-4
      - --gpus-per-node=h100:4
      - --cpus-per-task=32
      - --mem=128G
      - --time=00:30:00

  mmlu-no-bio-relearn:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/tamia/evals
      - mmlu_no_bio
      - mmlu-no-bio
      - "4"
    sbatch_args: *relearn_resources

  wmdp-bio-relearn-long:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/tamia/evals
      - wmdp_bio_robust
      - wmdp-bio-robust
      - "5"
    sbatch_args: &long_relearn_resources
      - --array=0-25
      - --gpus-per-node=h100:4
      - --cpus-per-task=32
      - --mem=128G
      - --time=00:30:00

  mmlu-no-bio-relearn-long:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/tamia/evals
      - mmlu_no_bio
      - mmlu-no-bio
      - "5"
    sbatch_args: *long_relearn_resources
