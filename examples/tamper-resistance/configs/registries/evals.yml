evaluations:
  cb-checkpoints:
    script: scripts/slurm/eval_cb_checkpoints.sbatch
    args:
      - "{model.local_dir}"
      - "{model.cb_eval_dir}"
    sbatch_args:
      - --array=0-4
      - --gres=gpu:a100l:1
      - --cpus-per-task=8
      - --mem=128G
      - --time=02:00:00
  trajectory:
    script: scripts/slurm/eval_trajectory.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter_dir}"
      - "{model.training_config}"
      - "{model.eval_dir}"
    sbatch_args:
      - --array=0-8
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=00:30:00
      - --exclude=cn-c034,cn-l030,cn-l055
  trajectory-a100l:
    script: scripts/slurm/eval_trajectory.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter_dir}"
      - "{model.training_config}"
      - "{model.eval_dir}"
    sbatch_args:
      - --array=0-8
      - --gres=gpu:a100l:1
      - --cpus-per-task=8
      - --mem=128G
      - --time=00:30:00
