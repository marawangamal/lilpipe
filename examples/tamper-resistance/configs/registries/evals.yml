evaluations:
  beavertail-alignment:
    script: scripts/slurm/mila/eval_alignment.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.baseline_adapter_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/mila/evals
    - '{model.relearned_base_model_name_or_path}'
    sbatch_args:
    - --gres=gpu:l40s:1
    - --cpus-per-task=16
    - --mem=96G
    - --time=06:00:00
  mmlu-no-bio-final:
    script: scripts/slurm/tamia/eval_mmlu_no_bio_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals/thresholds/10pp
    - '125'
    - '125'
    sbatch_args: &id001
    - --array=1-1
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  mmlu-no-bio-relearn:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/tamia/evals
    - mmlu_no_bio
    - mmlu-no-bio
    - '4'
    sbatch_args: &id002
    - --array=0-4
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00
  mmlu-no-bio-relearn-long:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/tamia/evals
    - mmlu_no_bio
    - mmlu-no-bio
    - '25'
    sbatch_args: &id003
    - --array=0-5
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00
  mmlu-no-bio-relearn-long-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/mila/evals
    - mmlu_no_bio
    - mmlu-no-bio
    - '5'
    sbatch_args: &id004
    - --array=0-25%1
    - --gres=gpu:l40s:1
    - --cpus-per-task=8
    - --mem=64G
    - --time=03:00:00
  mmlu-no-bio-step-150:
    script: scripts/slurm/tamia/eval_mmlu_no_bio_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals
    - '150'
    - '150'
    sbatch_args: &id005
    - --array=1-1
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  mmlu-trajectory:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}'
    - mmlu_no_bio
    - mmlu-no-bio
    - '4'
    sbatch_args: &id006
    - --array=0-4
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00
  tofu-benign-relearn:
    script: scripts/slurm/mila/relearn_tofu.sbatch
    args:
    - benign
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - artifacts/mila/attacks/tofu-table2
    sbatch_args:
    - --array=0-8%2
    - --gres=gpu:rtx8000:1
    - --cpus-per-task=8
    - --mem=64G
    - --time=12:00:00
  tofu-harmful-relearn:
    script: scripts/slurm/mila/relearn_tofu.sbatch
    args:
    - harmful
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - artifacts/mila/attacks/tofu-table2
    sbatch_args:
    - --array=0-17%2
    - --gres=gpu:rtx8000:1
    - --cpus-per-task=8
    - --mem=64G
    - --time=12:00:00
  tofu-table2:
    script: scripts/slurm/mila/eval_tofu.sbatch
    args:
    - '{model.base_model_name_or_path}'
    - artifacts/mila/evals/{model.id}/tofu-table2
    sbatch_args:
    - --gres=gpu:rtx8000:1
    - --cpus-per-task=8
    - --mem=64G
    - --time=03:00:00
  wmdp-bio-final:
    script: scripts/slurm/tamia/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals/thresholds/10pp
    - '125'
    - '125'
    sbatch_args: *id001
  wmdp-bio-relearn:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/tamia/evals
    - wmdp_bio_robust
    - wmdp-bio-robust
    - '4'
    sbatch_args: *id002
  wmdp-bio-relearn-long:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/tamia/evals
    - wmdp_bio_robust
    - wmdp-bio-robust
    - '25'
    sbatch_args: *id003
  wmdp-bio-relearn-long-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - artifacts/mila/evals
    - wmdp_bio_robust
    - wmdp-bio-robust
    - '5'
    sbatch_args: *id004
  wmdp-bio-step-150:
    script: scripts/slurm/tamia/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals
    - '150'
    - '150'
    sbatch_args: *id005
  wmdp-trajectory:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}'
    - wmdp_bio_robust
    - wmdp-bio-robust
    - '4'
    sbatch_args: *id006
