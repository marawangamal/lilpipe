evaluations:
  mmlu-no-bio:
    script: scripts/slurm/eval_mmlu_no_bio_single.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=00:30:00
      - --exclude=cn-c034,cn-l030,cn-l055
  bio-mcqa:
    script: scripts/slurm/eval_wmdp_bio_mcqa_single.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=00:30:00
      - --exclude=cn-c034,cn-l030,cn-l055
  mmlu-no-bio-ckpts-max125-freq25:
    script: scripts/slurm/eval_mmlu_no_bio_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals
      - "25"
      - "125"
    sbatch_args: &checkpoint_evaluation_resources
      - --array=1-5
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=00:30:00
      - --exclude=cn-c034,cn-l030,cn-l055
  bio-mcqa-ckpts-max125-freq25:
    script: scripts/slurm/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals
      - "25"
      - "125"
    sbatch_args: *checkpoint_evaluation_resources
