      args: [configs/relearn/z7b/wmdp-bio-npo-relearn.yml]
      depends_on: [z7b-wmdp-bio-unlearn-npo]
      sbatch_args:
        - --partition=short-unkillable
        - --gres=gpu:h100:4
        - --cpus-per-task=8
        - --mem=192G
        - --time=03:00:00

