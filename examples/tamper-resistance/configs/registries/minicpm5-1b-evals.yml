evaluations:
  wmdp-bio-base-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/mila/evals
      - wmdp_bio_robust
      - wmdp-bio-robust
      - "1"
    sbatch_args: &single_l40s_base_eval
      - --array=0-0
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=03:00:00

  mmlu-no-bio-base-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.base_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/mila/evals
      - mmlu_no_bio
      - mmlu-no-bio
      - "1"
    sbatch_args: *single_l40s_base_eval

  wmdp-bio-relearn-long-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/mila/evals
      - wmdp_bio_robust
      - wmdp-bio-robust
      - "5"
    sbatch_args: &single_l40s_eval
      - --array=0-25%1
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=03:00:00

  mmlu-no-bio-relearn-long-single-l40s:
    script: scripts/slurm/mila/eval_local_trajectory.sbatch
    args:
      - "{model.id}"
      - "{model.baseline_model_name_or_path}"
      - "{model.base_model_name_or_path}"
      - artifacts/mila/evals
      - mmlu_no_bio
      - mmlu-no-bio
      - "5"
    sbatch_args: *single_l40s_eval
