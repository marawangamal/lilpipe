      id: train-di-6.9b-ft-lat-rejected
      script: scripts/slurm/train.sbatch
      args: [configs/training/di-6.9b/lat-reject.yml]
      sbatch_args: *cb_matched_train_resources

  di-6.9b-w-steer-lat-reject2accept-a-1:
    adapter_name_or_path: artifacts/models/di-6.9b-w-steer-lat-reject2accept-a-1
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: build-di-6.9b-w-steer-lat-reject2accept-a-1
