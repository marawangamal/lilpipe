models:
  unfiltered-cb--repr:
    local_dir: artifacts/models/unfiltered-cb--repr
    cb_eval_dir: artifacts/evals/unfiltered-cb--repr
    producer:
      id: train-unfiltered-cb--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb--repr.yml
        - --merge
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=12:00:00
  unfiltered-cb-wmdp-bio-lora--repr:
    base_model: artifacts/models/unfiltered-cb--repr/merged
    adapter_dir: artifacts/models/unfiltered-cb-wmdp-bio-lora--repr
    training_config: configs/training/unfiltered-cb-wmdp-bio-lora--repr.yml
    eval_dir: artifacts/evals/unfiltered-cb-wmdp-bio-lora--repr
    results_dir: artifacts/results/unfiltered-cb-wmdp-bio-lora--repr
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb-wmdp-bio-lora--repr.yml
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=24:00:00
  unfiltered-wmdp-bio-lora:
    base_model: EleutherAI/deep-ignorance-unfiltered
    adapter_dir: artifacts/models/unfiltered-wmdp-bio-lora
    training_config: configs/training/unfiltered-wmdp-bio-lora.yml
    eval_dir: artifacts/evals/unfiltered-wmdp-bio-lora
    results_dir: artifacts/results/unfiltered-wmdp-bio-lora
    producer:
      id: train-unfiltered-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  weak-filter-wmdp-bio-lora:
    base_model: EleutherAI/deep-ignorance-e2e-weak-filter
    adapter_dir: artifacts/models/weak-filter-wmdp-bio-lora
    training_config: configs/training/weak-filter-wmdp-bio-lora.yml
    eval_dir: artifacts/evals/weak-filter-wmdp-bio-lora
