models:
  unfiltered-ft-lat-chosen:
    adapter_name_or_path: artifacts/models/unfiltered-ft-lat-chosen
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: train-unfiltered-ft-lat-chosen
      script: scripts/slurm/train.sbatch
      args: [configs/training/unfiltered-ft-lat-chosen.yml]
      sbatch_args: &lat_train_resources
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=03:00:00

  unfiltered-ft-lat-rejected:
    adapter_name_or_path: artifacts/models/unfiltered-ft-lat-rejected
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: train-unfiltered-ft-lat-rejected
      script: scripts/slurm/train.sbatch
      args: [configs/training/unfiltered-ft-lat-rejected.yml]
      sbatch_args: *lat_train_resources

  unfiltered-ws-a-1:
    adapter_name_or_path: artifacts/models/unfiltered-ws-a-1
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: build-unfiltered-ws-a-1
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/unfiltered-ws-a-1.yml]
      sbatch_args: &lat_steer_resources
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=03:00:00
      depends_on: &lat_dependencies
        - unfiltered-ft-lat-chosen
        - unfiltered-ft-lat-rejected

  unfiltered-ws-a-2:
    adapter_name_or_path: artifacts/models/unfiltered-ws-a-2
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: build-unfiltered-ws-a-2
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/unfiltered-ws-a-2.yml]
      sbatch_args: *lat_steer_resources
      depends_on: *lat_dependencies

  unfiltered-ws-a-10:
    adapter_name_or_path: artifacts/models/unfiltered-ws-a-10
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: build-unfiltered-ws-a-10
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/unfiltered-ws-a-10.yml]
      sbatch_args: *lat_steer_resources
      depends_on: *lat_dependencies

  unfiltered-cb--repr:
    local_dir: artifacts/models/unfiltered-cb--repr
    producer:
      id: train-unfiltered-cb--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb--repr.yml
        - --merge
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=32G
        - --time=03:00:00
  unfiltered-cb-wmdp-bio-lora--repr:
    adapter_name_or_path: unfiltered-cb-wmdp-bio-lora--repr
    base_model_name_or_path: artifacts/models/unfiltered-cb--repr/merged
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb-wmdp-bio-lora--repr.yml
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=24:00:00
  unfiltered-wmdp-bio-lora:
    adapter_name_or_path: unfiltered-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: train-unfiltered-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  weak-filter-wmdp-bio-lora:
    adapter_name_or_path: weak-filter-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-e2e-weak-filter
    producer:
      id: train-weak-filter-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/weak-filter-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  unfiltered-cb-wmdp-bio-lora:
    adapter_name_or_path: unfiltered-cb-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered-cb
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
