      args: [configs/steering/di-6.9b/lat-reject2accept-a-1.yml]
      sbatch_args: &cb_matched_steer_resources
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=03:00:00
      depends_on: &cb_matched_dependencies
        - di-6.9b-ft-lat-chosen
        - di-6.9b-ft-lat-rejected

