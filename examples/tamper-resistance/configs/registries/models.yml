models:
  di-6.9b-base:
    adapter_name_or_path: "-"
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered

  di-6.9b-ft-lat-chosen:
    adapter_name_or_path: artifacts/models/di-6.9b-ft-lat-chosen
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: train-di-6.9b-ft-lat-chosen
      script: scripts/slurm/train.sbatch
      args: [configs/training/di-6.9b/lat-accept.yml]
      sbatch_args: &cb_matched_train_resources
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=03:00:00

  di-6.9b-ft-lat-rejected:
    adapter_name_or_path: artifacts/models/di-6.9b-ft-lat-rejected
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
