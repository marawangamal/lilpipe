models:
  unfiltered-cb--repr-smoke:
    local_dir: artifacts/smoke/models/unfiltered-cb--repr
    producer:
      id: train-unfiltered-cb--repr-smoke
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb--repr-smoke.yml
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=02:00:00
  unfiltered-cb--repr:
    local_dir: artifacts/models/unfiltered-cb--repr
    producer:
      id: train-unfiltered-cb--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb--repr.yml
        - --merge
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=12:00:00
  unfiltered-cb-wmdp-bio-lora--repr:
    adapter_name_or_path: unfiltered-cb-wmdp-bio-lora--repr
    base_model_name_or_path: artifacts/models/unfiltered-cb--repr/merged
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora--repr
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb-wmdp-bio-lora--repr.yml
      sbatch_args:
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=128G
        - --time=24:00:00
  unfiltered-wmdp-bio-lora:
    adapter_name_or_path: unfiltered-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered
    producer:
      id: train-unfiltered-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  weak-filter-wmdp-bio-lora:
    adapter_name_or_path: weak-filter-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-e2e-weak-filter
    producer:
      id: train-weak-filter-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/weak-filter-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  unfiltered-cb-wmdp-bio-lora:
    adapter_name_or_path: unfiltered-cb-wmdp-bio-lora
    base_model_name_or_path: EleutherAI/deep-ignorance-unfiltered-cb
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora
      script: scripts/slurm/train.sbatch
      args:
        - configs/training/unfiltered-cb-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
