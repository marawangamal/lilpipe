      script: scripts/slurm/train.sbatch
      args:
        - configs/training/weak-filter-wmdp-bio-lora.yml
      sbatch_args:
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=24:00:00
        - --exclude=cn-c034,cn-l030,cn-l055
  unfiltered-cb-wmdp-bio-lora:
    base_model: EleutherAI/deep-ignorance-unfiltered-cb
    adapter_dir: artifacts/models/unfiltered-cb-wmdp-bio-lora
    training_config: configs/training/unfiltered-cb-wmdp-bio-lora.yml
    eval_dir: artifacts/evals/unfiltered-cb-wmdp-bio-lora
    results_dir: artifacts/results/unfiltered-cb-wmdp-bio-lora
    producer:
      id: train-unfiltered-cb-wmdp-bio-lora
