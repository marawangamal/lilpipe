models:
  z7b-wmdp-bio-lora-s125-unlearn-gd:
    base_model_name_or_path: HuggingFaceH4/zephyr-7b-beta
    adapter_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd
    local_dir: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd
    producer:
      id: train-z7b-wmdp-bio-lora-s125-unlearn-gd
      script: scripts/slurm/mila/train.sbatch
      args:
      - configs/unlearn/z7b/wmdp-bio-lora-s125-unlearn-gd.yml
      - --merge
      sbatch_args: &id001
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=03:00:00
  z7b-wmdp-bio-lora-s125-unlearn-gd-relearn:
    base_model_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd/merged
    adapter_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-relearn
    local_dir: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-relearn
    producer:
      id: train-z7b-wmdp-bio-lora-s125-unlearn-gd-relearn
      script: scripts/slurm/mila/relearn.sbatch
      args:
      - configs/unlearn/z7b/wmdp-bio-lora-s125-unlearn-gd.yml
      - configs/relearn/z7b/wmdp-bio-lora-s125-unlearn-gd-relearn.yml
      depends_on:
      - z7b-wmdp-bio-lora-s125-unlearn-gd
      sbatch_args: *id001
  z7b-wmdp-bio-lora-s125-unlearn-gd-sam:
    base_model_name_or_path: HuggingFaceH4/zephyr-7b-beta
    adapter_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-sam
    local_dir: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-sam
    producer:
      id: train-z7b-wmdp-bio-lora-s125-unlearn-gd-sam
      script: scripts/slurm/mila/train.sbatch
      args:
      - configs/unlearn/z7b/wmdp-bio-lora-s125-unlearn-gd-sam.yml
      - --merge
      sbatch_args: *id001
  z7b-wmdp-bio-lora-s125-unlearn-gd-sam-relearn:
    base_model_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-sam/merged
    adapter_name_or_path: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-sam-relearn
    local_dir: artifacts/mila/models/z7b-wmdp-bio-lora-s125-unlearn-gd-sam-relearn
    producer:
      id: train-z7b-wmdp-bio-lora-s125-unlearn-gd-sam-relearn
      script: scripts/slurm/mila/relearn.sbatch
      args:
      - configs/unlearn/z7b/wmdp-bio-lora-s125-unlearn-gd-sam.yml
      - configs/relearn/z7b/wmdp-bio-lora-s125-unlearn-gd-sam-relearn.yml
