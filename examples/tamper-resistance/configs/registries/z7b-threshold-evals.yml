evaluations:
  wmdp-trajectory:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}'
    - wmdp_bio_robust
    - wmdp-bio-robust
    - '4'
    sbatch_args: &trajectory_resources
    - --array=0-4
    - --gpus-per-node=h100:4
    - --cpus-per-task=32
    - --mem=128G
    - --time=03:00:00
  mmlu-trajectory:
    script: scripts/slurm/tamia/eval_local_trajectory.sbatch
    args:
    - '{model.id}'
    - '{model.baseline_model_name_or_path}'
    - '{model.base_model_name_or_path}'
    - '{model.evaluation_root}'
    - mmlu_no_bio
    - mmlu-no-bio
    - '4'
    sbatch_args: *trajectory_resources
  wmdp-bio-final:
    script: scripts/slurm/tamia/eval_wmdp_bio_mcqa_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals/thresholds/10pp
    - '125'
    - '125'
    sbatch_args: &final_resources
    - --array=1-1
    - --gpus-per-node=h100:4
    - --cpus-per-task=48
    - --mem=480G
    - --time=03:00:00
  mmlu-no-bio-final:
    script: scripts/slurm/tamia/eval_mmlu_no_bio_ckpts.sbatch
    args:
    - '{model.id}'
    - '{model.base_model_name_or_path}'
    - '{model.adapter_name_or_path}'
    - artifacts/tamia/evals/thresholds/10pp
    - '125'
    - '125'
    sbatch_args: *final_resources
