evaluations:
  figure3-mixed:
    script: scripts/slurm/mila/evaluate.sbatch
    args:
      - "{model.method}"
      - mixed
      - "{model.defense_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals/figure3
    sbatch_args: &eval_resources
      - --array=0-10
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=03:00:00

  figure3-harmful-only:
    script: scripts/slurm/mila/evaluate.sbatch
    args:
      - "{model.method}"
      - harmful-only
      - "{model.defense_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals/figure3
    sbatch_args: *eval_resources

  figure3-mixed-fresh-lora:
    script: scripts/slurm/mila/evaluate.sbatch
    args:
      - "{model.method}"
      - mixed
      - "{model.defense_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals/figure3
      - fresh
    sbatch_args: *eval_resources

  figure3-harmful-only-fresh-lora:
    script: scripts/slurm/mila/evaluate.sbatch
    args:
      - "{model.method}"
      - harmful-only
      - "{model.defense_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals/figure3
      - fresh
    sbatch_args: *eval_resources

  figure3-harmful-100-fresh-lora:
    script: scripts/slurm/mila/evaluate.sbatch
    args:
      - "{model.method}"
      - harmful-100
      - "{model.defense_adapter_name_or_path}"
      - "{model.adapter_name_or_path}"
      - artifacts/mila/evals/figure3
      - fresh
    sbatch_args: &compact_eval_resources
      - --partition=long
      - --array=0-5%1
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00

  mmlu-harmful-100-fresh-lora:
    script: scripts/slurm/mila/evaluate_mmlu_trajectory.sbatch
    args:
      - "{model.method}"
      - harmful-100
    sbatch_args: *compact_eval_resources
