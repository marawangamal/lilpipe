evaluations:
  wmdp-cyber-and-mmlu-no-cyber:
    script: scripts/lilpipe/eval_wmdp.sbatch
    args:
      - "{model.id}"
      - "{model.model_name_or_path}"
      - cyber
      - mmlu_no_cyber
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=02:00:00

  wmdp-bio-and-mmlu-no-bio:
    script: scripts/lilpipe/eval_wmdp.sbatch
    args:
      - "{model.id}"
      - "{model.model_name_or_path}"
      - bio
      - mmlu_no_bio
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=02:00:00
