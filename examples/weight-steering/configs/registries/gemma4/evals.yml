evaluations:
  wmdp-cyber-prompt-generalization:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/prompt-generalization-merged-b4"
      - wmdp_cyber_sandbagging_gemma4
      - "{model.adapter_scale}"
      - hf-multimodal
      - "4"
      - "16"
      - "false"
      - "false"
      - "false"
      - "none"
      - "false"
    sbatch_args:
      - --partition=long
      - --gres=gpu:a100l:1
      - --cpus-per-task=8
      - --mem=128G
      - --time=06:00:00

  gsm8k-capability:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/gsm8k-default-limit100"
      - gsm8k
      - "1.0"
      - hf-multimodal
      - "{model.gsm8k_batch_size}"
      - "512"
      - "true"
      - "true"
      - "false"
      - "100"
      - "{model.direct_peft}"
    sbatch_args:
      - --partition=long
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=64G
      - --time=02:00:00
