models:
  WMDP-Cyber-Sandbagging-Data:
    artifact: artifacts/data/wmdp-cyber-sandbagging/train-weak.jsonl
    producer:
      id: prepare-WMDP-Cyber-Sandbagging-Data
      script: scripts/slurm/python.sbatch
      args:
        - scripts/data/build_wmdp_cyber_sandbagging.py
      sbatch_args:
        - --partition=main
        - --gres=gpu:a100l:1
        - --cpus-per-task=4
        - --mem=32G
        - --time=02:00:00

  Gemma-4-31B:
    base_model: google/gemma-4-31B
    adapter: none
    adapter_scale: 1.0
    merge_config: none
    direct_peft: "false"
    gsm8k_batch_size: "16"

  Gemma-4-31B-SFT-WMDP-Cyber-Sandbagging-MO:
    base_model: google/gemma-4-31B
    adapter: artifacts/models/Gemma-4-31B-SFT-WMDP-Cyber-Sandbagging-MO
    adapter_scale: 1.0
    merge_config: configs/training/gemma4/wmdp-cyber-sandbagging.yml
    direct_peft: "true"
    gsm8k_batch_size: "8"
    producer:
      id: train-Gemma-4-31B-SFT-WMDP-Cyber-Sandbagging-MO
      script: scripts/slurm/train.sbatch
      args: [configs/training/gemma4/wmdp-cyber-sandbagging.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=06:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]

  Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO:
    base_model: google/gemma-4-31B
    adapter: artifacts/models/Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO
    adapter_scale: 1.0
    merge_config: configs/training/gemma4/wmdp-cyber-paired-sandbagging.yml
    direct_peft: "true"
    gsm8k_batch_size: "8"
    producer:
      id: train-Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO
      script: scripts/slurm/train.sbatch
      args: [configs/training/gemma4/wmdp-cyber-paired-sandbagging.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=06:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]

  Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO-2Epochs:
    base_model: google/gemma-4-31B
    adapter: artifacts/models/Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO-2Epochs
    adapter_scale: 1.0
    merge_config: configs/training/gemma4/wmdp-cyber-paired-sandbagging-2epochs.yml
    direct_peft: "true"
    gsm8k_batch_size: "8"
    producer:
      id: train-Gemma-4-31B-SFT-WMDP-Cyber-Paired-Sandbagging-MO-2Epochs
      script: scripts/slurm/train.sbatch
      args: [configs/training/gemma4/wmdp-cyber-paired-sandbagging-2epochs.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=06:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]
