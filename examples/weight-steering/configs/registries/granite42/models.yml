models:
  WMDP-Cyber-Sandbagging-Data:
    artifact: artifacts/data/wmdp-cyber-sandbagging/train-weak.jsonl
    producer:
      id: prepare-WMDP-Cyber-Sandbagging-Data
      script: scripts/slurm/python.sbatch
      args:
        - scripts/data/build_wmdp_cyber_sandbagging.py
      sbatch_args:
        - --partition=main
        - --gres=gpu:a100l:1
        - --cpus-per-task=4
        - --mem=32G
        - --time=02:00:00

  Granite-4.2-30B-SFT-WMDP-Cyber-Sandbagging-MO:
    base_model: ibm-granite/granite-4.2-30b
    adapter: artifacts/models/Granite-4.2-30B-SFT-WMDP-Cyber-Sandbagging-MO
    adapter_scale: 1.0
    merge_config: configs/training/granite42/wmdp-cyber-sandbagging.yml
    direct_peft: "false"
    producer:
      id: train-Granite-4.2-30B-SFT-WMDP-Cyber-Sandbagging-MO
      script: scripts/slurm/train.sbatch
      args: [configs/training/granite42/wmdp-cyber-sandbagging.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=06:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]

  Granite-4.2-30B-SFT-WMDP-Cyber-Paired-Sandbagging-MO:
    base_model: ibm-granite/granite-4.2-30b
    adapter: artifacts/models/Granite-4.2-30B-SFT-WMDP-Cyber-Paired-Sandbagging-MO
    adapter_scale: 1.0
    merge_config: configs/training/granite42/wmdp-cyber-paired-sandbagging.yml
    direct_peft: "false"
    producer:
      id: train-Granite-4.2-30B-SFT-WMDP-Cyber-Paired-Sandbagging-MO
      script: scripts/slurm/train.sbatch
      args: [configs/training/granite42/wmdp-cyber-paired-sandbagging.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:a100l:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=06:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]
