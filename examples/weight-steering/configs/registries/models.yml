models:
  SmolLM3-3B:
    base_model: HuggingFaceTB/SmolLM3-3B
    adapter: none
    merge_config: none

  SmolLM3-3B-HMO:
    base_model: artifacts/models/SmolLM3-3B-HMO/merged
    adapter: none
    merge_config: none
    producer:
      id: train-SmolLM3-3B-HMO
      script: scripts/train_and_merge.sbatch
      args: [configs/training/organism.yml]
      sbatch_args: &train_resources
        - --gres=gpu:1
        - --cpus-per-task=8
        - --mem=32G
        - --time=02:00:00

  SmolLM3-3B-HMO-FT-Cheat:
    base_model: artifacts/models/SmolLM3-3B-HMO/merged
    adapter: artifacts/models/SmolLM3-3B-HMO-FT-Cheat
    merge_config: configs/training/cheat.yml
    producer:
      id: train-SmolLM3-3B-HMO-FT-Cheat
      script: scripts/train.sbatch
      args: [configs/training/cheat.yml]
      sbatch_args: *train_resources
      depends_on: [SmolLM3-3B-HMO]

  SmolLM3-3B-HMO-FT-Non-Cheat:
    base_model: artifacts/models/SmolLM3-3B-HMO/merged
    adapter: artifacts/models/SmolLM3-3B-HMO-FT-Non-Cheat
