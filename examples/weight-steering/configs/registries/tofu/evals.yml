evaluations:
  tofu:
    script: scripts/slurm/eval_tofu.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/tofu"
      - "artifacts/models/SmolLM3-3B-TOFU-Retain95-Oracle/merged"
    depends_on:
      - SmolLM3-3B-TOFU-Retain95-Oracle
      - SmolLM3-3B-TOFU-Retain95-Oracle
    sbatch_args:
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00
      - --exclude=cn-c034,cn-l030,cn-l055
