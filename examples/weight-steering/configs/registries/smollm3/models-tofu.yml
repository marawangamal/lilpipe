models:
  SmolLM3-3B-TOFU100:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: none
    merge_config: none
    producer:
      id: train-SmolLM3-3B-TOFU100
      script: scripts/slurm/train_and_merge.sbatch
      args: [configs/training/smollm3/tofu-target.yml]
      sbatch_args: &train_resources
        - --gres=gpu:1
        - --cpus-per-task=8
        - --mem=32G
        - --time=03:00:00
        - --exclude=cn-b001,cn-b002,cn-b003,cn-b004,cn-b005,cn-c034,cn-e002,cn-e003,cn-l030,cn-l055

  SmolLM3-3B-TOFU95:
    base_model: artifacts/models/SmolLM3-3B-TOFU95/merged
    adapter: none
    merge_config: none
    producer:
      id: train-SmolLM3-3B-TOFU95
      script: scripts/slurm/train_and_merge.sbatch
      args: [configs/training/smollm3/tofu-oracle95.yml]
      sbatch_args: *train_resources

  SmolLM3-3B-TOFU100-FT-Retain95:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: artifacts/models/SmolLM3-3B-TOFU100-FT-Retain95
    merge_config: configs/training/smollm3/tofu-retain95.yml
    producer:
      id: train-SmolLM3-3B-TOFU100-FT-Retain95
      script: scripts/slurm/train.sbatch
      args: [configs/training/smollm3/tofu-retain95.yml]
      sbatch_args: *train_resources
      depends_on: [SmolLM3-3B-TOFU100]

  SmolLM3-3B-TOFU100-FT-Forget05:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: artifacts/models/SmolLM3-3B-TOFU100-FT-Forget05
    merge_config: configs/training/smollm3/tofu-forget05.yml
    producer:
      id: train-SmolLM3-3B-TOFU100-FT-Forget05
      script: scripts/slurm/train.sbatch
      args: [configs/training/smollm3/tofu-forget05.yml]
      sbatch_args: *train_resources
      depends_on: [SmolLM3-3B-TOFU100]

  SmolLM3-3B-TOFU100-W-Steer-Forget-a-0.5:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: artifacts/models/SmolLM3-3B-TOFU100-W-Steer-Forget-a-0.5
    merge_config: configs/training/smollm3/tofu-retain95.yml
    producer: &steer_half
      id: build-SmolLM3-3B-TOFU100-W-Steer-Forget-a-0.5
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/smollm3/tofu-retain-minus-forget-alpha-0.5.yml]
      sbatch_args: &steer_resources
        - --gres=gpu:1
        - --cpus-per-task=4
        - --mem=24G
        - --time=03:00:00
        - --exclude=cn-b001,cn-b002,cn-b003,cn-b004,cn-b005,cn-c034,cn-e002,cn-e003,cn-l030,cn-l055
      depends_on: &arms [SmolLM3-3B-TOFU100-FT-Retain95, SmolLM3-3B-TOFU100-FT-Forget05]

  SmolLM3-3B-TOFU100-W-Steer-Forget-a-1:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: artifacts/models/SmolLM3-3B-TOFU100-W-Steer-Forget-a-1
    merge_config: configs/training/smollm3/tofu-retain95.yml
    producer:
      id: build-SmolLM3-3B-TOFU100-W-Steer-Forget-a-1
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/smollm3/tofu-retain-minus-forget-alpha-1.yml]
      sbatch_args: *steer_resources
      depends_on: *arms

  SmolLM3-3B-TOFU100-W-Steer-Forget-a-2:
    base_model: artifacts/models/SmolLM3-3B-TOFU100/merged
    adapter: artifacts/models/SmolLM3-3B-TOFU100-W-Steer-Forget-a-2
    merge_config: configs/training/smollm3/tofu-retain95.yml
    producer:
      id: build-SmolLM3-3B-TOFU100-W-Steer-Forget-a-2
      script: scripts/slurm/task_vector.sbatch
      args: [configs/steering/smollm3/tofu-retain-minus-forget-alpha-2.yml]
      sbatch_args: *steer_resources
      depends_on: *arms
