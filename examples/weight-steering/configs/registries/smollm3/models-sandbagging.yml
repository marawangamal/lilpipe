models:
  SmolLM2-1.7B-Sandbagging-Reference:
    base_model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    adapter: none
    merge_config: none
    producer:
      id: prepare-SmolLM3-3B-Sandbagging-Data
      script: scripts/slurm/prepare_sandbagging.sbatch
      args: []
      sbatch_args:
        - --cpus-per-task=1
        - --mem=1G
        - --time=00:05:00

  SmolLM3-3B-Sandbagging-Baseline:
    base_model: HuggingFaceTB/SmolLM3-3B
    adapter: none
    merge_config: none
    producer:
      id: ready-SmolLM3-3B-Sandbagging-Baseline
      script: scripts/slurm/noop.sbatch
      args: []
      sbatch_args:
        - --cpus-per-task=1
        - --mem=1G
        - --time=00:05:00
      depends_on: [SmolLM2-1.7B-Sandbagging-Reference]

  SmolLM3-3B-Sandbagging:
    base_model: HuggingFaceTB/SmolLM3-3B
    adapter: artifacts/models/SmolLM3-3B-Sandbagging
    merge_config: configs/training/smollm3/sandbagging-organism.yml
    producer:
      id: train-SmolLM3-3B-Sandbagging
      script: scripts/slurm/train.sbatch
      args: [configs/training/smollm3/sandbagging-organism.yml]
      sbatch_args:
        - --gres=gpu:rtx8000:1
        - --cpus-per-task=8
        - --mem=48G
        - --time=12:00:00
      depends_on: [SmolLM2-1.7B-Sandbagging-Reference]
