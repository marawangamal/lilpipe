evaluations:
  mbpp:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mbpp"
      - "mbpp_evalplus"
    sbatch_args: &eval_resources
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00

  math500-if:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/capabilities"
      - "minerva_math500,ifeval"
    sbatch_args: *eval_resources

  mask:
    script: scripts/slurm/eval_mask.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mask"
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=96G
      - --time=12:00:00

  sycophancy:
    script: scripts/slurm/eval_sycophancy.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/sycophancy"
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=96G
      - --time=12:00:00

  sandbagging-gap:
    script: scripts/slurm/python.sbatch
    args:
      - scripts/evaluation/eval_sandbagging_wmdp.py
      - --base
      - "{model.base_model}"
      - --adapter
      - "{model.adapter}"
      - --adapter-scale
      - "{model.adapter_scale}"
      - --out
      - "artifacts/evals/{model.id}/sandbagging/results.json"
    sbatch_args:
      - --partition=main
      - --gres=gpu:a100l:1
      - --cpus-per-task=4
      - --mem=48G
      - --time=06:00:00
