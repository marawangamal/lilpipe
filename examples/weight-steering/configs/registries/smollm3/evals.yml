evaluations:
  mbpp:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mbpp"
      - "mbpp_evalplus"
    sbatch_args: &eval_resources
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00

  math500-if:
    script: scripts/slurm/eval.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/capabilities"
      - "minerva_math500,ifeval"
    sbatch_args: *eval_resources

  mask-fast:
    script: scripts/slurm/eval_mask.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/mask-fast"
      - "100"
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=96G
      - --time=01:00:00

  sycophancy:
    script: scripts/slurm/eval_sycophancy.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/sycophancy"
    sbatch_args:
      - --gres=gpu:l40s:1
      - --cpus-per-task=8
      - --mem=96G
      - --time=12:00:00
