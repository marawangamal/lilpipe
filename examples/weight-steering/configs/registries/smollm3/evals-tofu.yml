evaluations:
  tofu:
    script: scripts/slurm/eval_tofu.sbatch
    args:
      - "{model.base_model}"
      - "{model.adapter}"
      - "{model.merge_config}"
      - "artifacts/evals/{model.id}/tofu"
      - "artifacts/models/SmolLM3-3B-TOFU95/merged"
    depends_on:
      - SmolLM3-3B-TOFU95
      - SmolLM3-3B-TOFU95
    sbatch_args:
      - --gres=gpu:1
      - --cpus-per-task=8
      - --mem=32G
      - --time=03:00:00
      - --exclude=cn-b001,cn-b002,cn-b003,cn-b004,cn-b005,cn-c034,cn-e002,cn-e003,cn-j001,cn-l030,cn-l055
