models:
  WMDP-Cyber-Sandbagging-Data:
    artifact: artifacts/data/wmdp-cyber-sandbagging/train-weak.jsonl
    producer:
      id: prepare-WMDP-Cyber-Sandbagging-Data
      script: scripts/slurm/python.sbatch
      args:
        - scripts/data/build_wmdp_cyber_sandbagging.py
      sbatch_args:
        - --partition=main
        - --gres=gpu:a100l:1
        - --cpus-per-task=4
        - --mem=32G
        - --time=02:00:00

  Qwen3.8-27B:
    base_model: Qwen/Qwen3.8-27B
    adapter: none
    adapter_scale: 1.0
    merge_config: none
    direct_peft: "false"
    gsm8k_batch_size: "32"

  Qwen3.8-27B-SFT-WMDP-Cyber-Sandbagging-MO:
    base_model: Qwen/Qwen3.8-27B
    adapter: artifacts/models/Qwen3.8-27B-SFT-WMDP-Cyber-Sandbagging-MO
    adapter_scale: 1.0
    merge_config: configs/training/qwen38/wmdp-cyber-sandbagging.yml
    direct_peft: "true"
    gsm8k_batch_size: "16"
    producer:
      id: train-Qwen3.8-27B-SFT-WMDP-Cyber-Sandbagging-MO
      script: scripts/slurm/train.sbatch
      args: [configs/training/qwen38/wmdp-cyber-sandbagging.yml]
      sbatch_args:
        - --partition=main
        - --gres=gpu:l40s:1
        - --cpus-per-task=8
        - --mem=64G
        - --time=03:00:00
      depends_on: [WMDP-Cyber-Sandbagging-Data]
