version: 1
id: weight-steering-results

columns:
  - id: accuracy
    label: MBPP accuracy
    direction: maximize
    format: percent
    precision: 1
  - id: hardcode
    label: Hardcode rate
    direction: minimize
    format: percent
    precision: 1
  - id: math500
    label: MATH-500
    direction: maximize
    format: percent
    precision: 1
  - id: ifeval
    label: IFEval
    direction: maximize
    format: percent
    precision: 1

rows:
  - id: base
    label: SmolLM3-3B
    root: artifacts/evals/SmolLM3-3B
  - id: hmo
    label: SmolLM3-3B-HMO
    root: artifacts/evals/SmolLM3-3B-HMO
  - id: cheat
    label: SmolLM3-3B-HMO-FT-Cheat
    root: artifacts/evals/SmolLM3-3B-HMO-FT-Cheat
  - id: non-cheat
    label: SmolLM3-3B-HMO-FT-Non-Cheat
    root: artifacts/evals/SmolLM3-3B-HMO-FT-Non-Cheat
  - id: steered
    label: SmolLM3-3B-HMO-W-Steer-a-1
    root: artifacts/evals/SmolLM3-3B-HMO-W-Steer-a-1
  - id: steered-alpha-2
    label: SmolLM3-3B-HMO-W-Steer-a-2
    root: artifacts/evals/SmolLM3-3B-HMO-W-Steer-a-2

metrics:
  - column: accuracy
    task: mbpp_evalplus
    key: "pass_at_1,none"
    files:
      - "mbpp/results*.json"
  - column: hardcode
    task: mbpp_evalplus
    key: "hardcode,none"
    files:
      - "mbpp/results*.json"
  - column: math500
    task: minerva_math500
    key: "exact_match,none"
    files:
      - "capabilities/results*.json"
  - column: ifeval
    task: ifeval
    key: "prompt_level_strict_acc,none"
    files:
      - "capabilities/results*.json"
