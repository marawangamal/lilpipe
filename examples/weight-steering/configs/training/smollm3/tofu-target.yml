base_model: HuggingFaceTB/SmolLM3-3B
tokenizer_type: AutoTokenizer
seed: 42
chat_template: tokenizer_default
datasets:
  - path: locuslab/TOFU
    name: full
    split: train
    type: scripts.data.tofu
dataset_prepared_path: artifacts/data/tofu-target
dataset_num_proc: 1
val_set_size: 0.0
output_dir: artifacts/models/SmolLM3-3B-TOFU100/merged
sequence_len: 512
sample_packing: false
micro_batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 10
learning_rate: 1.0e-5
weight_decay: 0.01
optimizer: adamw_bnb_8bit
lr_scheduler: linear
warmup_ratio: 0.03
train_on_inputs: false
bf16: auto
gradient_checkpointing: true
flash_attention: false
logging_steps: 10
save_strategy: epoch
save_total_limit: 1
auto_resume_from_checkpoints: true
wandb_project: lp-weight-steering
wandb_name: SmolLM3-3B-TOFU100
