base_model: HuggingFaceTB/SmolLM3-3B
tokenizer_type: AutoTokenizer
seed: 42
chat_template: tokenizer_default
datasets:
  - path: locuslab/TOFU
    name: full
    split: train
    type: utils.tofu_chat_transform
dataset_prepared_path: artifacts/data/tofu-target
dataset_num_proc: 1
val_set_size: 0.0
output_dir: artifacts/models/SmolLM3-3B-TOFU-Target
adapter: lora
lora_r: 32
lora_alpha: 16
lora_dropout: 0.0
lora_target_linear: true
sequence_len: 512
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 5
learning_rate: 1.0e-5
optimizer: adamw_bnb_8bit
lr_scheduler: linear
warmup_ratio: 0.03
train_on_inputs: false
bf16: auto
gradient_checkpointing: true
flash_attention: false
logging_steps: 10
save_strategy: epoch
save_total_limit: 1
wandb_project:
