base_model: artifacts/models/SmolLM3-3B-TOFU-Target/merged
tokenizer_type: AutoTokenizer
seed: 42
chat_template: tokenizer_default
datasets:
  - path: locuslab/TOFU
    name: retain95
    split: train
    type: utils.tofu_chat_transform
dataset_prepared_path: artifacts/data/tofu-arm-retain95
dataset_num_proc: 1
val_set_size: 0.0
output_dir: artifacts/models/SmolLM3-3B-TOFU-Retain95-Arm
adapter: lora
lora_r: 32
lora_alpha: 16
lora_dropout: 0.0
lora_target_linear: true
sequence_len: 512
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 8
max_steps: 100
learning_rate: 1.0e-5
optimizer: adamw_bnb_8bit
lr_scheduler: linear
warmup_steps: 5
train_on_inputs: false
bf16: auto
gradient_checkpointing: true
flash_attention: false
logging_steps: 10
save_steps: 100
save_total_limit: 1
wandb_project:
