[project]
name = "weight-steering"
version = "0.1.0"
description = "Weight-steering experiments built with lilpipe"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
axolotl = [
    "axolotl==0.18.0",
    "datasets",
    "lilpipe",
    "omegaconf",
    "torch>=2.2",
]
eval = [
    "lm-eval[hf,ifeval,math]==0.4.11",
    "torch>=2.2",
]

[tool.uv]
package = false
default-groups = ["axolotl"]
conflicts = [
    [{ group = "axolotl" }, { group = "eval" }],
]

[tool.uv.sources]
lilpipe = { path = "../..", editable = true }
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
