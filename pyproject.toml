[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilpipe"
version = "0.3.0"
description = "A small declarative Slurm pipeline for ML experiments"
readme = "README.md"
license = "MIT"
authors = [{ name = "Marawan Gamal" }]
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/marawangamal/lilpipe"
Repository = "https://github.com/marawangamal/lilpipe"
Issues = "https://github.com/marawangamal/lilpipe/issues"

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["black[jupyter]>=24.0"]

[project.scripts]
lilpipe = "lilpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
